<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Watermark Remover</title>
<style>
body{font-family:system-ui;max-width:680px;margin:20px auto;padding:0 12px;background:#111;color:#eee}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row label{width:110px}.row input[type=range]{flex:1}
button{padding:10px 18px;font-size:16px;margin:10px 0}
canvas{max-width:100%;max-height:70vh;margin-top:8px;border:1px solid #333}
small{color:#aaa}
</style></head><body>
<h2>Gemini Watermark Remover</h2>
<p><small>Ek ya zyada image/video choose karo. Watermark apne aap detect hoga. Sab kuch browser mein hota hai, koi limit nahi.</small></p>
<input id="f" type="file" accept="image/*,video/*" multiple><br>
<small id="st"></small>
<div id="list"></div>
<div id="ctl" hidden>
 <div class="row"><label>Size <span id="szv"></span></label><input id="sz" type="range" min="16" max="300"></div>
 <div class="row"><label>Right gap <span id="rtv"></span></label><input id="rt" type="range" min="0" max="600"></div>
 <div class="row"><label>Bottom gap <span id="btv"></span></label><input id="bt" type="range" min="0" max="600"></div>
 <div class="row"><label>Edge width <span id="ewv"></span></label><input id="ew" type="range" min="1" max="6" value="3"></div>
 <div class="row"><label>Strength <span id="strv"></span>%</label><input id="str" type="range" min="5" max="70"></div>
 <label><input id="showres" type="checkbox" checked> Result dikhao</label>
 <label><input id="showbox" type="checkbox"> Box dikhao</label>
 <label><input id="healck" type="checkbox" checked> Edge smooth</label><br>
 <button id="go">Remove &amp; Download (sab files)</button>
</div>
<canvas id="pv" width="1" height="1"></canvas>
<video id="vid" playsinline style="display:none"></video>
<script>
const SH=72;
const SHAPE=Uint8Array.from(atob("AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADd3QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGP//2MAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALH//7EAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPX9/fUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/x8f8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAXf/l5f9dAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9P/V1f/0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8///i4v//PAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADv/+7y8u7/7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADT//fL6+vL9/zQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAANv/6Pj9/fjo/9sAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOv/77/v///vv+/86AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8f/19//////39f/xAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABo//r3/P/////89/r/aAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//+L4/v7+/v7++OL//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMX/7vb9//7///7//fbu/8UAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAZP//7/v+/////////vvv//9kAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAy///u/Pz////+/v////z87v//MgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABvv//D6+v/+/////////v/6+vD/7xsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMb/9Pr7/vz///////////z++/r0/8YAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArP//8P3+/////////////////v3w//+sAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACY//7w9P7///////////////////708P7/mAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH3///T5/v///v/////////////+///++fT//30AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAmP//9f///P/////////////////////8///1//+YAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACs///1////////////////////////////////9f//rAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAG8b//vT///7///////////////////////////7///T+/8YbAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAy7///8Pn//////////v/////////////+//////////nw///vMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGT///Tw9P78/////v/////////////////////+/////P708PT//2QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAxf//8Pr9/v/////////////////////////////////////+/frw///FAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGj////u+vv+/////////////////////////////////////////vv67v///2gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA68f//7u/8+v7///7////+/////////////////////////v////7///76/O/u///xOgAAAAAAAAAAAAAAAAAAAAAAAAAANNv///ri9vv8//z///////////////////////////////////////////z//Pv24vr//9s0AAAAAAAAAAAAAAAAAAAAADzv///79ff4/f7//v/////////////////////////////////////////////+//79+Pf1+///7zwAAAAAAAAAAAAAAABd9P///ejv9/z+/////////////////////////////////////////////////////////vz37+j9///0XQAAAAAAAGOx9f/////u8vj7///+/v/////////////////////////////////////////////////////+/v//+/jy7v/////1sWMA3f///fHl1eLy+v3////+///+/////////////////////////////////////////////////v///v////368uLV5fH9///d3f///fHl1eLy+v3////+///+/////////////////////////////////////////////////v///v////368uLV5fH9///dAGOx9f/////u8vj7///+/v/////////////////////////////////////////////////////+/v//+/jy7v/////1sWMAAAAAAABd9P///ejv9/z+/////////////////////////////////////////////////////////vz37+j9///0XQAAAAAAAAAAAAAAADzv///79ff4/f7//v/////////////////////////////////////////////+//79+Pf1+///7zwAAAAAAAAAAAAAAAAAAAAANNv///ri9vv8//z///////////////////////////////////////////z//Pv24vr//9s0AAAAAAAAAAAAAAAAAAAAAAAAAAA68f//7u/8+v7///7////+/////////////////////////v////7///76/O/u///xOgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGj////u+vv+/////////////////////////////////////////vv67v///2gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAxf//8Pr9/v/////////////////////////////////////+/frw///FAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGT///Tw9P78/////v/////////////////////+/////P708PT//2QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAy7///8Pn//////////v/////////////+//////////nw///vMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAG8b//vT///7///////////////////////////7///T+/8YbAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACs///1////////////////////////////////9f//rAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAmP//9f///P/////////////////////8///1//+YAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH3///T5/v///v/////////////+///++fT//30AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACY//7w9P7///////////////////708P7/mAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAArP//8P3+/////////////////v3w//+sAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMb/9Pr7/vz///////////z++/r0/8YAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABvv//D6+v/+/////////v/6+vD/7xsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAy///u/Pz////+/v////z87v//MgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAZP//7/v+/////////vvv//9kAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMX/7vb9//7///7//fbu/8UAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//+L4/v7+/v7++OL//wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABo//r3/P/////89/r/aAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8f/19//////39f/xAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOv/77/v///vv+/86AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAANv/6Pj9/fjo/9sAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADT//fL6+vL9/zQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADv/+7y8u7/7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8///i4v//PAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9P/V1f/0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAXf/l5f9dAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/x8f8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPX9/fUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAALH//7EAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGP//2MAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADd3QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"),c=>c.charCodeAt(0));
const _sc={};
function getShape(sz){
  if(_sc[sz])return _sc[sz];
  const out=new Float32Array(sz*sz),k=SH/sz;
  const bil=(u,v)=>{
    u=Math.min(SH-1,Math.max(0,u));v=Math.min(SH-1,Math.max(0,v));
    const x0=Math.floor(u),y0=Math.floor(v),x1=Math.min(SH-1,x0+1),y1=Math.min(SH-1,y0+1),fx=u-x0,fy=v-y0;
    return (SHAPE[y0*SH+x0]*(1-fx)+SHAPE[y0*SH+x1]*fx)*(1-fy)+(SHAPE[y1*SH+x0]*(1-fx)+SHAPE[y1*SH+x1]*fx)*fy;
  };
  for(let j=0;j<sz;j++)for(let i=0;i<sz;i++){
    let a=0;
    for(let sy=0;sy<2;sy++)for(let sx=0;sx<2;sx++)
      a+=bil((i+(sx+.5)/2)*k-.5,(j+(sy+.5)/2)*k-.5);
    out[j*sz+i]=a/1020;
  }
  return _sc[sz]=out;
}
function toGray(d,n){const g=new Float32Array(n);for(let i=0;i<n;i++)g[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;return g}
function medianFrames(fr){
  const n=fr[0].length,K=fr.length,out=new Float32Array(n),t=new Array(K);
  for(let i=0;i<n;i++){for(let k=0;k<K;k++)t[k]=fr[k][i];t.sort((a,b)=>a-b);out[i]=t[K>>1]}
  return out;
}
function boxDown(g,w,h,f){
  const dw=Math.floor(w/f),dh=Math.floor(h/f),o=new Float32Array(dw*dh);
  for(let y=0;y<dh;y++)for(let x=0;x<dw;x++){
    let s=0;for(let j=0;j<f;j++)for(let i=0;i<f;i++)s+=g[(y*f+j)*w+x*f+i];
    o[y*dw+x]=s/(f*f);
  }
  return {o,dw,dh};
}
function tStats(T){let m=0;for(const v of T)m+=v;m/=T.length;let q=0;for(const v of T)q+=(v-m)*(v-m);return{m,s:Math.sqrt(q/T.length)}}
function nccAt(I,w,h,T,t,ts,x,y){
  if(x<0||y<0||x+t>w||y+t>h)return -1;
  let s=0,q=0,dot=0;
  for(let j=0;j<t;j++){const r=(y+j)*w+x,tr=j*t;for(let i=0;i<t;i++){const v=I[r+i];s+=v;q+=v*v;dot+=v*T[tr+i]}}
  const n=t*t,m=s/n,vr=q/n-m*m;if(vr<1e-3)return -1;
  return (dot/n-m*ts.m)/(Math.sqrt(vr)*ts.s);
}
function nccSearch(I,w,h,T,t){
  const ts=tStats(T);let best={score:-1,x:0,y:0};
  const W1=w+1,S=new Float64Array(W1*(h+1)),Q=new Float64Array(W1*(h+1));
  for(let y=0;y<h;y++){let rs=0,rq=0;for(let x=0;x<w;x++){const v=I[y*w+x];rs+=v;rq+=v*v;S[(y+1)*W1+x+1]=S[y*W1+x+1]+rs;Q[(y+1)*W1+x+1]=Q[y*W1+x+1]+rq}}
  const n=t*t;
  for(let y=0;y+t<=h;y++)for(let x=0;x+t<=w;x++){
    const s=S[(y+t)*W1+x+t]-S[y*W1+x+t]-S[(y+t)*W1+x]+S[y*W1+x];
    const q=Q[(y+t)*W1+x+t]-Q[y*W1+x+t]-Q[(y+t)*W1+x]+Q[y*W1+x];
    const m=s/n,vr=q/n-m*m;if(vr<1e-3)continue;
    let dot=0;for(let j=0;j<t;j++){const r=(y+j)*w+x,tr=j*t;for(let i=0;i<t;i++)dot+=I[r+i]*T[tr+i]}
    const sc=(dot/n-m*ts.m)/(Math.sqrt(vr)*ts.s);
    if(sc>best.score)best={score:sc,x,y};
  }
  return best;
}
// M: gray median of bottom-right crop (cw x ch); W,H full frame size
function detect(M,cw,ch,W,H){
  const f=4,D=boxDown(M,cw,ch,f);
  const smin=.04*Math.min(W,H),smax=Math.min(.09*Math.max(W,H),Math.min(cw,ch)*.6);
  let best=null;
  for(let s=smin;s<=smax;s*=1.08){
    const t=Math.round(s/f);if(t<6||t>D.dw||t>D.dh)continue;
    const r=nccSearch(D.o,D.dw,D.dh,getShape(t),t);
    if(!best||r.score>best.score)best={score:r.score,x:r.x*f,y:r.y*f,sz:s};
  }
  if(!best)return null;
  let fb={score:-1};
  for(let k=.86;k<=1.14;k+=.02){
    const sz=Math.round(best.sz*k),T=getShape(sz),ts=tStats(T);
    for(let dy=-f;dy<=f;dy++)for(let dx=-f;dx<=f;dx++){
      const sc=nccAt(M,cw,ch,T,sz,ts,best.x+dx,best.y+dy);
      if(sc>fb.score)fb={score:sc,x:best.x+dx,y:best.y+dy,sz};
    }
  }
  return fb;
}
function estAlpha(M,cw,ch,x,y,sz){
  const S=getShape(sz),P=8;let si=0,ni=0,sr=0,nr=0;
  for(let yy=y-P;yy<y+sz+P;yy++)for(let xx=x-P;xx<x+sz+P;xx++){
    if(xx<0||yy<0||xx>=cw||yy>=ch)continue;
    const v=M[yy*cw+xx];
    if(xx>=x&&xx<x+sz&&yy>=y&&yy<y+sz){
      const s=S[(yy-y)*sz+xx-x];
      if(s>.95){si+=v;ni++}else if(s<.02){sr+=v;nr++}
    }else{sr+=v;nr++}
  }
  if(!ni||!nr)return .3;
  const mi=si/ni,mr=sr/nr,a=(mi-mr)/(255-mr);
  return(a>.1&&a<.7)?a:.3;
}
function makeAlpha(sz,strength){
  const S=getShape(sz),a=new Float32Array(sz*sz);
  for(let i=0;i<a.length;i++){const v=S[i]*strength;a[i]=v<.01?0:Math.min(v,.9)}
  return a;
}
function unblend(d,al){
  for(let k=0;k<al.length;k++){
    const a=al[k];if(!a)continue;
    const p=k*4,inv=1/(1-a),w=255*a;
    d[p]=(d[p]-w)*inv;d[p+1]=(d[p+1]-w)*inv;d[p+2]=(d[p+2]-w)*inv;
  }
}

// ---- edge heal: removes thin leftover outline around the star ----
const _hc={};
function _morph(m,n,r,dil){
  const o=new Uint8Array(n*n);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    let hit=dil?0:1;
    for(let j=-r;j<=r&&(dil?!hit:hit);j++)for(let i=-r;i<=r;i++){
      const yy=y+j,xx=x+i,v=(yy<0||xx<0||yy>=n||xx>=n)?0:m[yy*n+xx];
      if(dil){if(v){hit=1;break}}else if(!v){hit=0;break}
    }
    o[y*n+x]=hit;
  }
  return o;
}
function healMasks(sz,pad,grow){
  const key=sz+'_'+pad+'_'+grow;if(_hc[key])return _hc[key];
  const n=sz+2*pad,S=getShape(sz),any=new Uint8Array(n*n),core=new Uint8Array(n*n);
  for(let j=0;j<sz;j++)for(let i=0;i<sz;i++){const v=S[j*sz+i],k=(j+pad)*n+i+pad;any[k]=v>.04?1:0;core[k]=v>.5?1:0}
  const outer=_morph(any,n,grow,true),inner=_morph(core,n,grow,false);
  const band=[],known=new Uint8Array(n*n);
  for(let k=0;k<n*n;k++){if(outer[k]&&!inner[k])band.push(k);if(!outer[k])known[k]=1}
  return _hc[key]={n,band:Int32Array.from(band),known};
}
function heal(d,sz,pad,grow){
  const M=healMasks(sz,pad,grow),n=M.n,R=Math.max(pad-1,4);
  for(const k of M.band){
    const x=k%n,y=(k/n)|0;let r=0,g=0,b=0,c=0;
    for(let j=-R;j<=R;j++){const yy=y+j;if(yy<0||yy>=n)continue;
      for(let i=-R;i<=R;i++){const xx=x+i;if(xx<0||xx>=n)continue;
        const q=yy*n+xx;if(!M.known[q])continue;
        const w=1/(1+Math.abs(i)+Math.abs(j));r+=d[q*4]*w;g+=d[q*4+1]*w;b+=d[q*4+2]*w;c+=w}}
    if(c>0){d[k*4]=r/c;d[k*4+1]=g/c;d[k*4+2]=b/c}
  }
}
// unblend star (sz x sz alpha) located at offset pad inside an n x n RGBA patch
function unblendPad(d,n,al,sz,pad){
  for(let j=0;j<sz;j++)for(let i=0;i<sz;i++){
    const a=al[j*sz+i];if(!a)continue;
    const p=((j+pad)*n+i+pad)*4,inv=1/(1-a),w=255*a;
    d[p]=(d[p]-w)*inv;d[p+1]=(d[p+1]-w)*inv;d[p+2]=(d[p+2]-w)*inv;
  }
}

const $=id=>document.getElementById(id);
let entries=[],cur=null,busy=false;
const seek=(v,t)=>new Promise(r=>{v.onseeked=()=>r();v.currentTime=t});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const num=id=>+$(id).value;
const baseName=f=>f.name.replace(/\.[^.]+$/,'');

function geoFrom(p,W,H){
  const sz=Math.max(8,p.sz|0),px=Math.max(0,W-p.rt-sz),py=Math.max(0,H-p.bt-sz),grow=num('ew');
  const pad=Math.max(0,Math.min(8,px,py,p.rt,p.bt));
  return{sz,px,py,pad,n:sz+2*pad,ex:px-pad,ey:py-pad,str:p.str/100,grow,heal:$('healck').checked&&pad>=grow+1};
}
const paramsFromUI=()=>({sz:num('sz'),rt:num('rt'),bt:num('bt'),str:num('str')});
function fixPatch(d,g,al){
  unblendPad(d,g.n,al,g.sz,g.pad);
  if(g.heal)heal(d,g.sz,g.pad,g.grow);
}
function applyPatch(ctx,g){
  const im=ctx.getImageData(g.ex,g.ey,g.n,g.n);
  fixPatch(im.data,g,makeAlpha(g.sz,g.str));
  ctx.putImageData(im,g.ex,g.ey);
}
function render(){
  if(!cur||!cur.base)return;
  const pv=$('pv');pv.width=cur.W;pv.height=cur.H;
  const x=pv.getContext('2d',{willReadFrequently:true});
  x.drawImage(cur.base,0,0);
  const g=geoFrom(paramsFromUI(),cur.W,cur.H);
  if($('showres').checked)applyPatch(x,g);
  if($('showbox').checked){x.strokeStyle='red';x.lineWidth=2;x.strokeRect(g.px,g.py,g.sz,g.sz)}
  ['sz','rt','bt','str','ew'].forEach(k=>$(k+'v').textContent=$(k).value);
}
['sz','rt','bt','str'].forEach(k=>$(k).oninput=()=>{if(cur){cur.params=paramsFromUI();cur.edited=true}render()});
['ew','showres','showbox','healck'].forEach(k=>$(k).oninput=render);

function renderList(){
  const L=$('list');L.innerHTML='';
  entries.forEach((e,i)=>{
    const b=document.createElement('button');
    b.textContent=(e.done?'✓ ':'')+e.file.name;
    b.style.cssText='display:block;width:100%;text-align:left;margin:3px 0;padding:6px 10px;font-size:13px;'+(e===cur?'border:2px solid #4af':'');
    b.onclick=()=>{if(!busy)select(i)};
    L.appendChild(b);
  });
}

$('f').onchange=async e=>{
  const files=[...e.target.files];if(!files.length)return;
  entries=files.map(f=>({file:f}));cur=null;renderList();
  await select(0);
};

async function select(i){
  const e=entries[i];
  $('ctl').hidden=true;$('st').textContent='Detect ho raha hai...';
  try{
    if(cur&&cur!==e)cur.base=null;
    if(!e.base){const a=await analyze(e.file);const keep=e.params&&e.edited?e.params:null;Object.assign(e,a);if(keep){e.params=keep}}
    cur=e;fillUI(e);renderList();
  }catch(err){console.error(err);$('st').textContent='Error: '+err.message}
}

async function analyze(file){
  const isVid=file.type.startsWith('video');
  let W,H,v,src;const base=document.createElement('canvas'),frames=[];
  if(isVid){
    v=document.createElement('video');v.muted=true;v.preload='auto';v.src=URL.createObjectURL(file);
    await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=()=>j(new Error('Video load nahi hui'))});
    W=v.videoWidth;H=v.videoHeight;src=v;
  }else{src=await createImageBitmap(file);W=src.width;H=src.height}
  const cw=Math.round(W*.45),ch=Math.round(H*.35);
  const cc=document.createElement('canvas');cc.width=cw;cc.height=ch;
  const cx=cc.getContext('2d',{willReadFrequently:true});
  base.width=W;base.height=H;
  const K=isVid?7:1;
  for(let k=0;k<K;k++){
    if(isVid)await seek(v,v.duration*(.08+.84*k/(K-1)));
    cx.drawImage(src,W-cw,H-ch,cw,ch,0,0,cw,ch);
    frames.push(toGray(cx.getImageData(0,0,cw,ch).data,cw*ch));
    if(!isVid||k===3)base.getContext('2d').drawImage(src,0,0);
  }
  if(isVid){URL.revokeObjectURL(v.src)}
  const M=K>1?medianFrames(frames):frames[0],r=detect(M,cw,ch,W,H);
  let params,detected=false,score=0;
  if(r&&r.score>.45){
    detected=true;score=r.score;
    params={sz:r.sz,rt:Math.max(0,W-(W-cw+r.x)-r.sz),bt:Math.max(0,H-(H-ch+r.y)-r.sz),str:Math.round(estAlpha(M,cw,ch,r.x,r.y,r.sz)*100)};
  }else{
    params={sz:Math.round(.067*Math.min(W,H)),rt:Math.round(.133*W),bt:Math.round(.073*H),str:30};
  }
  return{isVid,W,H,base,params,detected,score};
}

function fillUI(e){
  const p=e.params;
  $('sz').max=Math.round(Math.min(e.W,e.H)*.4);$('rt').max=Math.round(e.W*.6);$('bt').max=Math.round(e.H*.6);
  $('sz').value=p.sz;$('rt').value=p.rt;$('bt').value=p.bt;$('str').value=p.str;
  $('showbox').checked=!e.detected;
  $('st').textContent=e.detected
    ?`Watermark mil gaya (match ${(e.score*100).toFixed(0)}%). Preview check karo, phir download.`
    :'Auto-detect pakka nahi hua. Box dikhao aur sliders se sparkle par set karo.';
  $('ctl').hidden=false;render();
}

function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}

$('go').onclick=async()=>{
  if(!entries.length||busy)return;
  busy=true;$('go').disabled=true;
  const tuned=cur;const tp=tuned?paramsFromUI():null;
  for(let i=0;i<entries.length;i++){
    const e=entries[i],tag=`File ${i+1}/${entries.length}: `;
    try{
      $('st').textContent=tag+'taiyaar ho raha hai...';
      if(!e.W){const a=await analyze(e.file);Object.assign(e,a);e.base=null}
      let p=e.params;
      if(e===tuned)p=tp;
      else if(tuned&&tuned.edited&&e.W===tuned.W&&e.H===tuned.H)p=tp; // same resolution -> reuse your tuned settings
      if(e.isVid)await doVid(e,p,tag);else await doImg(e,p);
      e.done=true;renderList();
    }catch(err){console.error(err);$('st').textContent=tag+'Error: '+err.message;await sleep(1500)}
  }
  $('st').textContent='Sab files ho gayi.';
  busy=false;$('go').disabled=false;
};

async function doImg(e,p){
  const b=await createImageBitmap(e.file);
  const c=document.createElement('canvas');c.width=b.width;c.height=b.height;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(b,0,0);
  applyPatch(x,geoFrom(p,b.width,b.height));
  await new Promise(r=>c.toBlob(bl=>{dl(bl,'clean_'+baseName(e.file)+'.png');r()},'image/png'));
}

async function doVid(e,p,tag){
  if(!window.MediaRecorder)throw new Error('Is browser mein MediaRecorder nahi hai, Chrome use karo');
  const v=$('vid');v.src=URL.createObjectURL(e.file);
  await new Promise(r=>v.onloadedmetadata=r);
  const W=v.videoWidth,H=v.videoHeight,g=geoFrom(p,W,H),al=makeAlpha(g.sz,g.str);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d',{alpha:false});            // GPU canvas = smooth
  const pc=document.createElement('canvas');pc.width=g.n;pc.height=g.n;
  const px=pc.getContext('2d',{willReadFrequently:true}); // only small patch read per frame
  const st=c.captureStream(0),vt=st.getVideoTracks()[0];
  try{v.captureStream().getAudioTracks().forEach(t=>st.addTrack(t))}catch(err){}
  const mt=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  const ext=mt.startsWith('video/mp4')?'mp4':'webm';
  const rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:12e6}),ch=[];
  const finished=new Promise(r=>{
    rec.ondataavailable=ev=>ch.push(ev.data);
    rec.onstop=()=>{dl(new Blob(ch,{type:mt.split(';')[0]}),'clean_'+baseName(e.file)+'.'+ext);r()};
  });
  const paint=()=>{
    x.drawImage(v,0,0,W,H);
    px.drawImage(v,g.ex,g.ey,g.n,g.n,0,0,g.n,g.n);
    const im=px.getImageData(0,0,g.n,g.n);fixPatch(im.data,g,al);px.putImageData(im,0,0);
    x.drawImage(pc,g.ex,g.ey);
    if(vt.requestFrame)vt.requestFrame();
  };
  const loop=()=>{
    paint();
    $('st').textContent=`${tag}Processing ${Math.round(v.currentTime/v.duration*100)}% (tab open rakho)`;
    if(!v.ended){v.requestVideoFrameCallback?v.requestVideoFrameCallback(loop):requestAnimationFrame(loop)}
  };
  v.onended=()=>{paint();setTimeout(()=>rec.stop(),120)};
  // first frame is pushed several times AFTER the recorder is running, so the
  // file's first frame (= thumbnail) is the real picture, never black
  await seek(v,0);paint();
  rec.start();
  for(let k=0;k<6;k++){await sleep(40);paint()}
  await v.play();loop();
  await finished;
  URL.revokeObjectURL(v.src);
}
